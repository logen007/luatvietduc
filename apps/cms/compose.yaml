services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: luatvietduc
      POSTGRES_USER: lvd
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set a local development password}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - lvd_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lvd -d luatvietduc"]
      interval: 5s
      retries: 10
volumes:
  lvd_postgres:
