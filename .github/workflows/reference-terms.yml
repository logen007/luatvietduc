name: Inspect requested Terms reference
on:
  push:
    branches: [terms-layout-v080]
    paths: ['.github/workflows/reference-terms.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare browser
        run: |
          python3 -m pip install 'playwright==1.55.0'
          python3 -m playwright install --with-deps chromium
      - name: Read actual reference and current website
        run: |
          mkdir -p design-inspection/reference design-inspection/source design-inspection/current
          python3 - <<'PY'
          from pathlib import Path
          import json, shutil, http.server, threading, urllib.request
          from playwright.sync_api import sync_playwright
          out=Path('design-inspection')
          for name in ['index.html','assets','scripts','.github','README.md','.nojekyll']:
            src=Path(name); dst=out/'source'/name
            if src.is_dir():shutil.copytree(src,dst,ignore=shutil.ignore_patterns('*.woff','*.woff2','*.ttf','*.otf'))
            elif src.is_file():shutil.copy2(src,dst)
          class Quiet(http.server.SimpleHTTPRequestHandler):
            def log_message(self,*a):pass
          server=http.server.ThreadingHTTPServer(('127.0.0.1',0),Quiet)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          with sync_playwright() as p:
            browser=p.chromium.launch()
            context=browser.new_context(viewport={'width':1440,'height':1000},reduced_motion='reduce')
            page=context.new_page()
            for slug,address in [('terms','https://terms.so/'),('terms-about','https://terms.so/about'),('terms-pricing','https://terms.so/pricing')]:
              try:
                page.goto(address,wait_until='networkidle',timeout=60000)
                page.evaluate('document.fonts.ready')
                page.wait_for_timeout(1500)
                page.screenshot(path=str(out/'reference'/f'{slug}-desktop.png'),full_page=True)
                (out/'reference'/f'{slug}.html').write_text(page.content())
                data=page.evaluate('''() => {
                  const selector='header,header nav,header a,main,section,article,h1,h2,h3,footer,footer a,button,input,textarea';
                  return {url:location.href,title:document.title,bodyBackground:getComputedStyle(document.body).background,viewport:innerWidth,
                    stylesheets:[...document.styleSheets].map(s=>s.href).filter(Boolean),
                    css:[...document.styleSheets].filter(s=>!s.href||s.href.startsWith(location.origin)).map(s=>{try{return [...s.cssRules].map(r=>r.cssText).join('\n')}catch{return ''}}).join('\n'),
                    elements:[...document.querySelectorAll(selector)].map(e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return {tag:e.tagName,cls:e.className,text:e.innerText?.slice(0,160),x:r.x,y:r.y+scrollY,w:r.width,h:r.height,color:s.color,bg:s.background,font:s.fontFamily,size:s.fontSize,weight:s.fontWeight,leading:s.lineHeight,tracking:s.letterSpacing,padding:s.padding,gap:s.gap,radius:s.borderRadius,border:s.border,shadow:s.boxShadow}}).filter(e=>e.w&&e.h)};
                }''')
                (out/'reference'/f'{slug}-styles.json').write_text(json.dumps(data,ensure_ascii=False,indent=2))
                if slug=='terms':
                  for offset in [0,850,1700,2550,3400]:
                    page.evaluate('(y)=>window.scrollTo(0,y)',offset)
                    page.wait_for_timeout(450)
                    page.screenshot(path=str(out/'reference'/f'terms-section-{offset}.png'))
                  page.set_viewport_size({'width':390,'height':900})
                  page.goto(address,wait_until='networkidle',timeout=60000)
                  page.wait_for_timeout(1000)
                  page.screenshot(path=str(out/'reference'/'terms-mobile.png'),full_page=True)
                  page.set_viewport_size({'width':1440,'height':1000})
                print('Inspected',address,flush=True)
              except Exception as error:
                (out/'reference'/f'{slug}-error.txt').write_text(str(error));print('Reference problem:',slug,error,flush=True)
            for name,route in [('home','/'),('library','/tra-cuu'),('news','/tin-tuc'),('chat','/hoi-dap-ai'),('contact','/lien-he')]:
              page.goto(f'http://127.0.0.1:{server.server_port}/#'+route,wait_until='networkidle',timeout=60000)
              page.screenshot(path=str(out/'current'/f'{name}.png'),full_page=True)
            browser.close()
          server.shutdown()
          PY
      - name: Internal design reference
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: terms-live-design-inspection
          path: design-inspection/
          retention-days: 1
