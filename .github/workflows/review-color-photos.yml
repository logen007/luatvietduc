name: Review original color photographs
on:
  push:
    branches: [color-photos-v0.6.4]
    paths: ['.github/workflows/review-color-photos.yml','scripts/refresh-color-photos.py','scripts/test-fonts.py','assets/typography.css']
permissions:
  contents: write
concurrency:
  group: color-photos-v064
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Install image and browser checks
        run: |
          python3 -m pip install 'Pillow>=11,<13' 'playwright==1.55.0'
          python3 -m playwright install --with-deps chromium
      - name: Restore original-color photographs and update attribution
        run: python3 scripts/refresh-color-photos.py
      - name: Check all existing pages and interactions
        run: python3 scripts/test-chat.py
      - name: Verify actual Vietnamese glyph families and full-color images
        run: python3 scripts/test-fonts.py
      - name: Save only verified website changes to the review branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/photos assets/photo-sources.json assets/newsroom.js assets/news-content.js assets/newsroom.css assets/steel-ui.css
          if ! git diff --cached --quiet; then
            git commit -m 'fix: restore original-color photos and activate uniform Vietnamese type'
            git push origin HEAD:refs/heads/color-photos-v0.6.4
          fi
      - name: Internal visual verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: color-vietnamese-qa
          path: qa-fonts/
          if-no-files-found: ignore
          retention-days: 1
