name: Terms reference metrics
on:
  push:
    branches: [terms-layout-v080]
    paths: ['.github/workflows/reference-metrics.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          python3 -m pip install 'playwright==1.55.0'
          python3 -m playwright install --with-deps chromium
      - run: |
          mkdir -p reference
          python3 - <<'PY'
          from pathlib import Path
          import json
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
            b=p.chromium.launch()
            page=b.new_page(viewport={'width':1440,'height':1000},reduced_motion='reduce')
            for width in (1440,390):
              page.set_viewport_size({'width':width,'height':1000})
              page.goto('https://terms.so/',wait_until='networkidle',timeout=60000)
              page.evaluate('document.fonts.ready')
              page.wait_for_timeout(500)
              data=page.evaluate(r'''() => ({url:location.href, width:innerWidth,
                elements:[...document.querySelectorAll('header,main,section,h1,h2,h3,footer,button')].map(e=>{let s=getComputedStyle(e),r=e.getBoundingClientRect();return {tag:e.tagName,cls:e.className,text:e.innerText.slice(0,130),x:r.x,y:r.y+scrollY,w:r.width,h:r.height,fg:s.color,bg:s.background,font:s.fontFamily,size:s.fontSize,weight:s.fontWeight,line:s.lineHeight,tracking:s.letterSpacing,padding:s.padding,radius:s.borderRadius}}),
                css:[...document.styleSheets].map(s=>{try{return [...s.cssRules].map(r=>r.cssText).join('\n')}catch{return ''}}).join('\n')})''')
              Path(f'reference/metrics-{width}.json').write_text(json.dumps(data,ensure_ascii=False,indent=2))
              page.screenshot(path=f'reference/full-{width}.png',full_page=True)
              page.screenshot(path=f'reference/top-{width}.png')
            b.close()
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: terms-reference-metrics
          path: reference/
          retention-days: 1
