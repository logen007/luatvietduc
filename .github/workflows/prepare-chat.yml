name: Prepare chat-first interface
on:
  push:
    branches: [chat-first-v0.5]
    paths: ['assets/chat-first.*','scripts/apply-chat-ui.py','scripts/test-chat.py','.github/workflows/prepare-chat.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prepare-chat-preview
  cancel-in-progress: true
jobs:
  integrate:
    if: github.ref_name == 'chat-first-v0.5'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Apply the reviewed app integration
        run: python3 scripts/apply-chat-ui.py
      - name: Check script syntax
        run: |
          node --check assets/app.js
          node --check assets/chat-first.js
      - name: Install test browser
        run: |
          python3 -m pip install 'playwright==1.55.0'
          python3 -m playwright install --with-deps chromium
      - name: Test chat, knowledge review, news and mobile layouts
        run: python3 scripts/test-chat.py
      - name: Commit only the tested shell and router integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/app.js
          if ! git diff --cached --quiet; then
            git commit -m 'feat: activate tested chat-first homepage and conversation routes'
            git push origin HEAD:refs/heads/chat-first-v0.5
          fi
