name: Verify v0.9 bilingual and jurisdiction design
on:
  push:
    branches: [bilingual-jurisdictions-team-v090]
    paths: ['.github/workflows/review-bilingual-v090.yml','assets/**','index.html','scripts/test-bilingual-v090.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate script syntax and legal source counts
        run: |
          for js in assets/*.js; do node --check "$js"; done
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          for fn in ['bilingual.js','site-features.js','legal-de.js','features.css']:
            assert 'assets/'+fn+'?v=0.9.0' in html,fn
          assert '16' in Path('assets/catalog-source.js').read_text()
          assert 'expectedTotal:303' in Path('assets/catalog-source.js').read_text()
          assert "Gặp chuyên viên" not in Path('assets/chat-first.js').read_text()
          assert 'data-language="de"' in html
          print('PASS source contracts')
          PY
      - name: Install browser
        run: |
          python3 -m pip install 'playwright==1.55.0' 'Pillow>=11,<13'
          python3 -m playwright install --with-deps chromium
      - name: Bilingual UI and two law systems
        run: python3 scripts/test-bilingual-v090.py
      - name: Existing chat and content validation
        run: python3 scripts/test-chat.py
      - name: Vietnamese font and color photography
        run: python3 scripts/test-fonts.py
      - name: Catalogue topics sourced from workbook
        run: python3 scripts/test-catalog.py
      - name: Original layout and icon separation
        run: python3 scripts/test-terms-layout.py
