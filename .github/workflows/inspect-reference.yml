name: Inspect design reference
on:
  push:
    branches: [steel-ui-v0.6]
    paths: ['.github/workflows/inspect-reference.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: |
          python3 -m pip install 'playwright==1.55.0'
          python3 -m playwright install --with-deps chromium
      - name: Inspect public reference
        run: |
          mkdir -p review-internal/source
          cp index.html review-internal/source/
          cp -r assets scripts review-internal/source/
          python3 - <<'PY'
          import json,re,urllib.request
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path('review-internal')
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              page=b.new_page(viewport={'width':1440,'height':1000},device_scale_factor=1)
              resp=page.goto('https://steel.dev/',wait_until='domcontentloaded',timeout=60000)
              page.wait_for_timeout(6000)
              page.evaluate('document.fonts.ready')
              out.joinpath('steel.html').write_text(page.content())
              page.screenshot(path=str(out/'steel-top.png'))
              page.screenshot(path=str(out/'steel-full.png'),full_page=True)
              result=page.evaluate('''() => {
                const tags=['h1','h2','h3','p','a','button'];
                const styles=tags.flatMap(tag=>Array.from(document.querySelectorAll(tag)).filter(e=>e.getBoundingClientRect().width>0&&e.textContent.trim()).slice(0,18).map(e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return {tag,text:e.textContent.trim().slice(0,140),family:s.fontFamily,weight:s.fontWeight,size:s.fontSize,line:s.lineHeight,spacing:s.letterSpacing,color:s.color,background:s.backgroundColor,x:r.x,y:r.y,width:r.width,height:r.height}}));
                return {url:location.href,title:document.title,fonts:Array.from(document.fonts).map(f=>({family:f.family,weight:f.weight,style:f.style,status:f.status})),styles,css:Array.from(document.querySelectorAll('style')).map(e=>e.textContent).join('\n'),sheets:Array.from(document.querySelectorAll('link[rel=stylesheet]')).map(e=>e.href)};
              }''')
              out.joinpath('steel-typography.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
              print(json.dumps({k:v for k,v in result.items() if k!='css'},ensure_ascii=False,indent=2))
              print('FONT FACES',re.findall(r'@font-face\s*\{[^}]+\}',result['css'])[:40])
              page.set_viewport_size({'width':390,'height':844})
              page.wait_for_timeout(1000)
              page.screenshot(path=str(out/'steel-mobile.png'))
              b.close()
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reference-inspection
          path: review-internal/
          retention-days: 1
