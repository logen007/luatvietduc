name: Review public copy
on:
  push:
    branches: [copy-cleanup-v0.5.1]
    paths: ['scripts/refine-public-copy.py','.github/workflows/refine-copy.yml']
permissions:
  contents: write
concurrency:
  group: review-public-copy
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Apply reviewed copy and update text-sensitive tests
        run: |
          python3 scripts/refine-public-copy.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/test-chat.py');s=p.read_text()
          s=s.replace("'chưa có đủ'", "'chưa có'").replace("'Đang chờ'", "'Chờ chuyên viên'")
          s=s.replace("page.locator('.chat-status a[href^=\"#/chuyen-vien\"]').click()", "page.evaluate(\"location.hash='/chuyen-vien'\");page.wait_for_timeout(150)")
          s=s.replace("expect(page.locator('.chat-context')).to_contain_text('không tự động')", "expect(page.locator('.chat-context')).to_contain_text('Về bài viết')")
          p.write_text(s)
          p=Path('assets/news-content.js');s=p.read_text()
          for old,new in {
            'Lương tối thiểu 2026: mức 13,90 euro/giờ cần được hiểu đúng.':'Lương tối thiểu tại Đức: 13,90 euro/giờ từ năm 2026',
            'Kindergeld tăng lên 259 euro mỗi tháng cho mỗi trẻ đủ điều kiện.':'Kindergeld 2026: 259 euro/tháng cho mỗi trẻ đủ điều kiện',
            'Deutschlandticket sẽ tăng lên 66,80 euro từ đầu năm 2027.':'Vé Deutschlandticket tăng lên 66,80 euro từ năm 2027',
            'Mới chuyển nhà ở Berlin: bắt đầu từ Anmeldung.':'Đăng ký địa chỉ cư trú (Anmeldung) tại Berlin',
            'Làm thẻ cư trú: đừng nhầm ảnh số với ảnh scan.':'Ảnh số khi làm thẻ cư trú: những điều cần biết',
            'Tìm Ausbildung: những cổng thông tin nên bắt đầu.':'Các trang tìm chỗ học nghề (Ausbildung) tại Đức',
            'Dong Xuan Center: một điểm hẹn quen ở Berlin.':'Dong Xuan Center: điểm hẹn tại Berlin',
            'Minijob 2026: mốc thu nhập tăng lên 603 euro.':'Minijob 2026: mức thu nhập 603 euro',
            'Học tiếng Đức trong đời sống: tìm lớp và nơi hỗ trợ.':'Tìm lớp học tiếng Đức và chương trình hỗ trợ',
            'Mang hộ chiếu Đức về Việt Nam: đọc đúng quy định miễn thị thực.':'Miễn thị thực Việt Nam cho người mang hộ chiếu Đức'
          }.items():
            assert old in s,old
            s=s.replace(old,new)
          p.write_text(s)
          p=Path('assets/chat-first.css');p.write_text(p.read_text()+'''
          .chat-news .press-copy h2{overflow-wrap:anywhere}.chat-news .press-section-head>h2{min-width:0}.ask-library{min-width:0}.ask-bottom .button{flex-shrink:0}
          .news-detail h1,.news-detail h2,.news-detail p,.news-detail figcaption,.news-detail a{overflow-wrap:anywhere}.news-reading,.news-aside{min-width:0}.news-byline{flex-wrap:wrap}.news-byline>div{min-width:0}.news-bottom-nav{flex-wrap:wrap}
          @media(max-width:680px){.chat-news .press-grid:not(.four){display:block}.chat-news .press-grid:not(.four)>.press-card+article{display:grid;grid-template-columns:108px minmax(0,1fr);gap:16px;border-top:1px solid #ddd;margin-top:23px;padding-top:20px}.chat-news .press-grid:not(.four)>.press-card+article .press-photo{aspect-ratio:1.15}.chat-news .press-grid:not(.four)>.press-card+article .press-meta{margin-top:0}.chat-news .press-grid:not(.four)>.press-card+article h2{font-size:17px;line-height:1.4}.chat-news .press-grid.four h2{font-size:17px;line-height:1.4}}
          @media(max-width:359px){.chat-news .press-grid:not(.four)>.press-card+article{grid-template-columns:90px minmax(0,1fr);gap:13px}.chat-news .four .press-copy h2{font-size:16px}}
          ''')
          PY
          node --check assets/chat-first.js
          node --check assets/newsroom.js
          node --check assets/news-content.js
          node --check assets/app.js
      - name: Install browser
        run: |
          python3 -m pip install 'playwright==1.55.0'
          python3 -m playwright install --with-deps chromium
      - name: Check copy density and capture internal visual QA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import functools,http.server,threading
          from playwright.sync_api import sync_playwright
          out=Path('qa-internal');out.mkdir(exist_ok=True)
          class Quiet(http.server.SimpleHTTPRequestHandler):
              def log_message(self,*a):pass
          srv=http.server.ThreadingHTTPServer(('127.0.0.1',0),functools.partial(Quiet,directory=str(Path.cwd())))
          threading.Thread(target=srv.serve_forever,daemon=True).start()
          base=f'http://127.0.0.1:{srv.server_port}/'
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              page=b.new_page(viewport={'width':1440,'height':1000})
              for w in [320,390,768,1440]:
                  page.set_viewport_size({'width':w,'height':1000})
                  page.goto(base+'#/');page.wait_for_timeout(150)
                  body=page.locator('body').inner_text()
                  for phrase in ['Một hướng giải đáp rõ ràng','Nhập câu hỏi theo cách','Xem luồng vận hành','Tra cứu kiến thức đã chuẩn bị','Thích tự tìm hiểu trước','BẢN DUYỆT']:
                      assert phrase not in body,(w,phrase)
                  assert page.locator('.preview-bar').count()==0
                  assert page.locator('#home-demo').is_visible()
                  assert page.locator('a[href="#/chuyen-vien"]').count()==0
                  assert page.evaluate('document.documentElement.scrollWidth')<=w+1
                  if w==1440:
                      assert page.locator('.chat-hero').bounding_box()['height']<475
                      assert page.locator('.chat-news').first.bounding_box()['y']<560
                  for img in page.locator('.press-photo img').all():
                      img.scroll_into_view_if_needed();img.evaluate('(el)=>el.decode()')
                  page.evaluate('scrollTo(0,0)')
                  if w in [390,1440]:page.screenshot(path=str(out/f'home-{w}.png'),full_page=True)
                  page.goto(base+'#/hoi-dap-ai');page.wait_for_timeout(100)
                  assert page.locator('.chat-compose-help').is_visible()
                  assert page.evaluate('document.documentElement.scrollWidth')<=w+1
                  if w in [390,1440]:page.screenshot(path=str(out/f'chat-{w}.png'))
                  print('PASS public copy and layout',w,flush=True)
              b.close()
          srv.shutdown()
          PY
      - name: Test chat handoff knowledge review and original routes
        run: python3 scripts/test-chat.py
      - name: Commit verified website source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/chat-first.js assets/chat-first.css assets/app.js assets/newsroom.js assets/news-content.js scripts/test-chat.py
          git commit -m 'fix: simplify public copy, remove review scaffolding and shorten the homepage'
          git push origin HEAD:refs/heads/copy-cleanup-v0.5.1
      - name: Internal visual QA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: copy-visual-check
          path: qa-internal/
          if-no-files-found: ignore
          retention-days: 2
