name: Import approved wireframe

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/wireframe.html.gz.b64'
      - '.github/workflows/import-wireframe.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-wireframe
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out this repository
        uses: actions/checkout@v6
      - name: Restore the wireframe HTML without changing its layout
        id: restore
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path

          source = Path('bootstrap/wireframe.html.gz.b64')
          if not source.exists():
              print('Waiting for the approved wireframe package.')
              raise SystemExit(0)
          if Path('index.html').exists():
              print('index.html already exists; the importer will not overwrite it.')
              raise SystemExit(0)
          lines = source.read_text(encoding='ascii').splitlines()
          expected = lines[0].strip()
          data = gzip.decompress(base64.b64decode(''.join(lines[1:]), validate=True))
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit('Wireframe checksum mismatch; no files written.')
          text = data.decode('utf-8')
          if '<!doctype html>' not in text.lower() or 'id="WF13"' not in text:
              raise SystemExit('Incomplete wireframe; no files written.')
          Path('index.html').write_bytes(data)
          Path('.nojekyll').write_text('', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('restored=true\n')
          print('Restored verified HTML:', len(data), 'bytes')
          PY
      - name: Save editable HTML on main
        if: steps.restore.outputs.restored == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html .nojekyll
          git commit -m 'feat: publish Luat Viet Duc wireframe source'
          git push origin HEAD:main
