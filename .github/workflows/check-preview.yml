name: Check published HTML

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - '.github/workflows/check-preview.yml'
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-luatvietduc-preview
  cancel-in-progress: true

jobs:
  verify-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify live source fingerprints
        run: |
          python3 - <<'PY'
          import hashlib, json, os, time, urllib.request
          from pathlib import Path
          from html.parser import HTMLParser
          base = 'https://logen007.github.io/luatvietduc/'
          paths = ['index.html', 'assets/styles.css', 'assets/content.js', 'assets/app.js']
          html = Path('index.html').read_text(encoding='utf-8')
          assert 'content="0.3.0"' in html
          assert 'noindex, nofollow' in html
          assert 'connect-src \'none\'' in html
          assert 'onclick=' not in html
          for path in paths:
              assert Path(path).is_file(), path
          expected = {path:hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in paths}
          final_urls = {}
          for attempt in range(18):
              try:
                  for path in paths:
                      address = base + ('' if path == 'index.html' else path) + '?verify=' + expected[path][:14]
                      request = urllib.request.Request(address, headers={'User-Agent':'LuatVietDuc-Release-Check','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          assert response.status == 200, (path,response.status)
                          actual = hashlib.sha256(response.read()).hexdigest()
                          final_urls[path] = response.geturl()
                      if actual != expected[path]:
                          raise RuntimeError('Waiting for published asset: ' + path)
                  break
              except Exception as exc:
                  print('Attempt', attempt+1, str(exc))
                  if attempt == 17:
                      raise
                  time.sleep(10)
          report = {'status':'passed','version':'0.3.0','url':base,'verified_assets':expected,'resolved_urls':final_urls}
          print(json.dumps(report,ensure_ascii=False,indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write('## Luật Việt Đức HTML 0.3 verified\n\n')
              out.write('HTTP 200. Live HTML, CSS, content fixtures and JavaScript match repository fingerprints.\n\n')
              out.write(base+'\n')
          PY
