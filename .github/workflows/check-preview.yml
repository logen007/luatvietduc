name: Check published HTML
on:
  push:
    branches: [main]
    paths: ['index.html','assets/**','.github/workflows/check-preview.yml']
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-luatvietduc-preview
  cancel-in-progress: true
jobs:
  verify-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify live HTML chat scripts styles and photographs
        run: |
          python3 - <<'PY'
          import hashlib,json,os,time,urllib.request
          from pathlib import Path
          base='https://logen007.github.io/luatvietduc/'
          paths=['index.html','assets/styles.css','assets/content.js','assets/app.js','assets/news-content.js','assets/newsroom.js','assets/newsroom.css','assets/photo-sources.json','assets/chat-first.js','assets/chat-first.css','assets/chat-router.js']
          paths+=sorted(str(p) for p in Path('assets/photos').glob('*-600.webp'))
          html=Path('index.html').read_text()
          assert 'content="0.5.0"' in html
          assert 'noindex, nofollow' in html and 'onclick=' not in html
          assert 'connect-src \'none\'' in html
          expected={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}
          for attempt in range(18):
              try:
                  for path,digest in expected.items():
                      address=base+('' if path=='index.html' else path)+'?verify='+digest[:14]
                      req=urllib.request.Request(address,headers={'User-Agent':'LuatVietDuc-Release-Check','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=20) as response:
                          assert response.status==200
                          actual=hashlib.sha256(response.read()).hexdigest()
                      if actual!=digest:raise RuntimeError('Waiting for asset: '+path)
                  break
              except Exception as exc:
                  print('Attempt',attempt+1,str(exc),flush=True)
                  if attempt==17:raise
                  time.sleep(10)
          print(json.dumps({'status':'passed','version':'0.5.0','verified_count':len(paths),'url':base,'sha256':expected},indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write('## Luật Việt Đức chat-first 0.5 verified\n\nHTTP 200. Live HTML, chat, news, styles and image assets match repository fingerprints.\n\n'+base+'\n')
          PY
