name: Check published HTML
on:
  push:
    branches: [main]
    paths: ['index.html','assets/**','.github/workflows/check-preview.yml']
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-luatvietduc-preview
  cancel-in-progress: true
jobs:
  verify-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify published HTML and loaded assets
        run: |
          python3 - <<'PY'
          import hashlib, json, time, urllib.request
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          paths={'index.html'}
          class Assets(HTMLParser):
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  value=a.get('src') if tag=='script' else a.get('href') if tag=='link' and a.get('rel')=='stylesheet' else ''
                  if value and value.startswith('assets/'): paths.add(urlsplit(value).path)
          html=Path('index.html').read_text()
          Assets().feed(html)
          assert 'noindex, nofollow' in html
          assert 'terms-alignment.css' in html
          assert '#/nguon-anh' not in html
          assert 'expectedTotal:303' in Path('assets/catalog-source.js').read_text()
          paths.update(str(p) for p in Path('assets/photos').glob('*.webp'))
          paths.update(str(p) for p in Path('assets').glob('*.svg'))
          expected={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in sorted(paths)}
          for attempt in range(18):
              try:
                  for path,digest in expected.items():
                      address='https://logen007.github.io/luatvietduc/'+('' if path=='index.html' else path)+'?verify='+digest[:14]
                      req=urllib.request.Request(address,headers={'User-Agent':'LuatVietDuc-Release-Check','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=20) as response:
                          assert response.status==200
                          actual=hashlib.sha256(response.read()).hexdigest()
                      if actual!=digest: raise RuntimeError('Waiting for '+path)
                  break
              except Exception as exc:
                  print('Attempt',attempt+1,str(exc),flush=True)
                  if attempt==17: raise
                  time.sleep(8)
          print(json.dumps({'status':'passed','verified_count':len(paths),'sha256':expected},indent=2))
          PY
