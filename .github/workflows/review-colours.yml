name: Review multi-colour editorial palette
on:
  push:
    branches: [chromatic-terms-inspired-v076]
    paths:
      - '.github/workflows/review-colours.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate CSS and content version
        run: |
          node --check assets/app.js
          node --check assets/catalog.js
          node --check assets/chat-first.js
          node --check assets/newsroom.js
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          css=Path('assets/chromatic-editorial.css').read_text()
          assert 'content="0.7.6"' in html
          assert 'assets/chromatic-editorial.css?v=0.7.6' in html
          assert css.count('--lvd-') >= 10
          assert 'linear-gradient(115deg,#242b45' in css
          assert 'nth-child(5n+3)' in css
          assert 'expectedTotal:303' in Path('assets/catalog-source.js').read_text()
          print('Brand palette tokens, assets and 303 catalogue topics are intact')
          PY
      - name: Install browser
        run: |
          python3 -m pip install 'playwright==1.55.0'
          python3 -m playwright install --with-deps chromium
      - name: Test editorial sections across desktop and mobile
        run: |
          mkdir -p internal-colour-qa
          python3 - <<'PY'
          import functools,http.server,threading,json
          from playwright.sync_api import sync_playwright
          class Quiet(http.server.SimpleHTTPRequestHandler):
            def log_message(self,*args):pass
          server=http.server.ThreadingHTTPServer(('127.0.0.1',0),Quiet)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          base='http://127.0.0.1:'+str(server.server_port)+'/#'
          routes=[
            ('home','/'),('catalog','/tra-cuu'),
            ('topics','/tra-cuu?xem=tat-ca'),('news','/tin-tuc'),
            ('guide','/song-o-duc'),('article','/tin/mindestlohn-2026'),
            ('chat','/hoi-dap-ai'),('about','/ve-chuyen-trang'),
            ('contact','/gui-cau-hoi')]
          with sync_playwright() as p:
            b=p.chromium.launch()
            for width in [320,390,768,1440]:
              ctx=b.new_context(viewport={'width':width,'height':900},locale='vi-VN',reduced_motion='reduce')
              page=ctx.new_page()
              errors=[]
              page.on('pageerror',lambda e:errors.append(str(e)))
              for label,route in routes:
                page.goto(base+route,wait_until='load')
                page.wait_for_timeout(100)
                info=page.evaluate("""() => {
                  let s=e=>e ? getComputedStyle(e).backgroundColor:'';
                  return {
                    width: document.documentElement.scrollWidth,viewport: innerWidth,
                    h1:document.querySelector('#main h1')?.textContent,
                    cards:document.querySelectorAll('.catalog-group').length,
                    tiles:document.querySelectorAll('.s-library-links>a').length,
                    colours:[...document.querySelectorAll('.catalog-group')].slice(0,5).map(s),
                    homeColours:[...document.querySelectorAll('.s-library-links>a')].slice(0,4).map(s),
                    prompts:[...document.querySelectorAll('.chat-prompts button')].map(s),
                    broken:[...document.querySelectorAll('#main img')].filter(i=>i.complete && i.naturalWidth===0).length,
                    style:[...document.styleSheets].some(x=>x.href?.includes('chromatic-editorial.css')),
                    chat:document.querySelector('.chat-shell')?.getBoundingClientRect().width || 0,
                    header:document.querySelector('.site-header .container').getBoundingClientRect().width
                  }
                }""")
                assert info['width']<=width+2,(label,width,info)
                assert info['style'] and info['h1'] and not info['broken'],(label,width,info)
                if label=='home':
                  assert info['tiles']>=4 and len(set(info['homeColours']))>=4,(width,info)
                if label=='catalog':
                  assert info['cards']==16 and len(set(info['colours']))==5,(width,info)
                if label=='chat':
                  assert len(info['prompts'])>=4 and len(set(info['prompts']))>=4,(width,info)
                  assert abs(info['chat']-info['header'])<3,(width,info)
                if width in (390,1440) and label in ('home','catalog','news','chat'):
                  page.screenshot(path=f'internal-colour-qa/{label}-{width}.png',full_page=(label!='chat'))
                print('PASS',width,label,flush=True)
              assert not errors,errors
              ctx.close()
            b.close()
          server.shutdown()
          print('All 36 palette views passed')
          PY
      - name: Keep screenshots internal
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chromatic-visual-review
          path: internal-colour-qa/
          retention-days: 1
          if-no-files-found: ignore
