name: Review sourced German landmark
on:
  push:
    branches: [sourced-germany-svg-v0.6.6]
    paths: ['assets/germany-details.css','.github/workflows/review-sourced-svg.yml']
permissions:
  contents: write
concurrency:
  group: sourced-germany-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Install SVG and browser verification tools
        run: |
          python3 -m pip install 'playwright==1.55.0' Pillow CairoSVG
          python3 -m playwright install --with-deps chromium
      - name: Import the credited CC0 source without redrawing it
        run: |
          python3 - <<'PY'
          import urllib.request,hashlib,xml.etree.ElementTree as ET,io,json
          from pathlib import Path
          import cairosvg
          from PIL import Image,ImageChops
          url='https://upload.wikimedia.org/wikipedia/commons/3/32/BrandenburgerTorSilhouette.svg'
          source_page='https://commons.wikimedia.org/wiki/File:BrandenburgerTorSilhouette.svg'
          req=urllib.request.Request(url,headers={'User-Agent':'LuatVietDuc/1.0 (CC0 illustration; author credited)'})
          with urllib.request.urlopen(req,timeout=40) as response:source=response.read(100000)
          digest=hashlib.sha256(source).hexdigest()
          assert digest=='c2bad66b31c24ae0a8717189819c7b5d6fcec429955dbab61f646ba1e0592fe5'
          ns='http://www.w3.org/2000/svg';ET.register_namespace('',ns)
          root=ET.fromstring(source)
          def clean(parent):
            for child in list(parent):
              name=child.tag.rsplit('}',1)[-1]
              if not child.tag.startswith('{'+ns+'}') or name in ('metadata','defs','text') or (name=='path' and not child.get('d')):
                parent.remove(child);continue
              clean(child)
            for key in list(parent.attrib):
              if key.startswith('{') or key=='id':del parent.attrib[key]
            parent.text=None;parent.tail=None
          clean(root)
          root.set('viewBox','0 0 1240.1575 1052.3622')
          root.set('preserveAspectRatio','xMidYMid meet')
          title=ET.Element('{'+ns+'}title');title.text='Brandenburg Gate silhouette — Jahobr';root.insert(0,title)
          desc=ET.Element('{'+ns+'}desc');desc.text='CC0-1.0. '+source_page+'. Original geometry retained; editor metadata and off-canvas scale text removed.';root.insert(1,desc)
          result=ET.tostring(root,encoding='utf-8',short_empty_elements=True)
          # Lossless cleanup: confirm shape rendering against the downloaded source.
          before=Image.open(io.BytesIO(cairosvg.svg2png(bytestring=source,output_width=620,output_height=526))).convert('RGBA')
          after=Image.open(io.BytesIO(cairosvg.svg2png(bytestring=result,output_width=620,output_height=526))).convert('RGBA')
          assert ImageChops.difference(before,after).getbbox() is None,'Source silhouette changed during cleanup'
          Path('assets/brandenburg-gate.svg').write_bytes(result)
          Path('assets/illustration-sources.json').write_text(json.dumps([{
            'id':'brandenburg-gate','title':'Brandenburg Gate silhouette','author':'Jahobr',
            'source':source_page,'original':url,'license':'CC0-1.0','license_url':'https://creativecommons.org/publicdomain/zero/1.0/',
            'source_sha256':digest,'asset_sha256':hashlib.sha256(result).hexdigest(),'bytes':len(result),
            'modifications':'Removed editor metadata and off-canvas scale text; added a responsive viewBox. Geometry is unchanged and the render is pixel-identical at the test size. Display color, size and opacity are set only through CSS.'
          }],ensure_ascii=False,indent=2)+'\n')
          Path('assets/berlin-line.svg').unlink(missing_ok=True)
          p=Path('index.html');p.write_text(p.read_text().replace('0.6.5','0.6.6'))
          print('Imported existing SVG:',len(result),'bytes; original geometry verified unchanged')
          PY
      - name: Verify all existing pages and reader interactions
        run: python3 scripts/test-chat.py
      - name: Verify Vietnamese typography and original color photographs
        run: python3 scripts/test-fonts.py
      - name: Inspect mask scaling placement and narrow screens
        run: |
          python3 - <<'PY'
          import functools,http.server,threading,json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path('qa-sourced');out.mkdir(exist_ok=True)
          class Quiet(http.server.SimpleHTTPRequestHandler):
            def log_message(self,*args):pass
          server=http.server.ThreadingHTTPServer(('127.0.0.1',0),functools.partial(Quiet,directory=str(Path.cwd())))
          threading.Thread(target=server.serve_forever,daemon=True).start();base=f'http://127.0.0.1:{server.server_port}/'
          report=[]
          with sync_playwright() as p:
            browser=p.chromium.launch();context=browser.new_context(reduced_motion='reduce',locale='vi-VN');page=context.new_page();errors=[]
            page.on('pageerror',lambda e:errors.append(str(e)))
            for w in [320,390,768,1024,1280,1440,1920]:
              page.set_viewport_size({'width':w,'height':960});page.goto(base+'#/',wait_until='networkidle');page.evaluate('document.fonts.ready')
              assert page.evaluate('document.documentElement.scrollWidth')<=w+1
              assert page.locator('.s-rail-label').count()==0
              assert page.locator('.press-photo img').count()==7
              result=page.locator('.s-hero').evaluate('''e=>{const s=getComputedStyle(e,'::after');return {display:s.display,mask:s.maskImage,size:s.maskSize,width:parseFloat(s.width),height:parseFloat(s.height),opacity:s.opacity,pointer:s.pointerEvents}}''')
              assert result['pointer']=='none'
              if w>1100:
                assert 'brandenburg-gate.svg' in result['mask'] and result['size']=='contain'
                assert abs(result['width']/result['height']-1240.1575/1052.3622)<.005,result
                assert float(result['opacity'])<=.1
              else:assert result['display']=='none',result
              report.append({'width':w,'decoration':result})
              if w in [390,1440,1920]:
                page.screenshot(path=str(out/f'hero-{w}.png'))
              if w==1440:page.locator('.site-footer').screenshot(path=str(out/'footer-1440.png'))
              if w==390:page.locator('.s-guides-section').screenshot(path=str(out/'news-390.png'))
            assert not errors,errors
            browser.close()
          server.shutdown();(out/'report.json').write_text(json.dumps(report,indent=2))
          PY
      - name: Keep only tested website changes on the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/brandenburg-gate.svg assets/illustration-sources.json
          git add -u assets/berlin-line.svg
          if ! git diff --cached --quiet; then
            git commit -m 'assets: replace hand-drawn Berlin skyline with verified CC0 Brandenburg Gate'
            git push origin HEAD:refs/heads/sourced-germany-svg-v0.6.6
          fi
      - name: Internal screenshot review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sourced-svg-visual-review
          path: qa-sourced/
          if-no-files-found: ignore
          retention-days: 1
