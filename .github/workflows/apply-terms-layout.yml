name: Apply and review Terms layout
on:
  push:
    branches: [terms-layout-v080]
    paths: ['.github/workflows/apply-terms-layout.yml']
permissions:
  contents: write
concurrency:
  group: terms-layout-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply authored design files with checksum and path validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request,os,base64,json,lzma,hashlib
          request=urllib.request.Request('https://api.github.com/repos/logen007/luatvietduc/git/blobs/6f7a173ac9596f269b49928047689d262d0ce537',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'LuatVietDuc-design-review'})
          with urllib.request.urlopen(request,timeout=30) as response:payload=json.load(response)
          raw=base64.b64decode(payload['content'])
          assert hashlib.sha256(raw).hexdigest()=='257ab062dafd971eeb3915811a60a615648d3b7b8e62cd1e8e74e5c868357cb0'
          files=json.loads(lzma.decompress(raw))
          expected={'assets/steel-ui.js','assets/terms-alignment.css','scripts/test-terms-layout.py','.github/workflows/check-preview.yml','.github/workflows/qa-prototype.yml'}
          assert set(files)==expected
          for path,text in files.items():
            assert isinstance(text,str) and '..' not in Path(path).parts
            p=Path(path)
            if path.startswith('.github/'):
              assert p.read_text()==text, 'Workflow configuration must be committed separately: '+path
              continue
            p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text,encoding='utf-8')
          index=Path('index.html');html=index.read_text()
          if 'content="0.8.0"' not in html:
            assert 'content="0.7.8"' in html
            html=html.replace('  <link rel="stylesheet" href="assets/chromatic-editorial.css?v=0.7.8">\n','')
            marker='<link rel="stylesheet" href="assets/contact-legal.css?v=0.7.8">'
            assert marker in html
            html=html.replace(marker,marker+'\n  <link rel="stylesheet" href="assets/terms-alignment.css?v=0.7.8">')
            start=html.index('    <section class="lvd-footer-invite"')
            end=html.index('</section>',start)+len('</section>')
            html=html[:start]+html[end:]
            html=html.replace('0.7.8','0.8.0');index.write_text(html)
          router=Path('assets/chat-router.js');source=router.read_text()
          old="el.style.minHeight='0';el.style.height=Math.max(240,(window.visualViewport?.height||innerHeight)-top)+'px';"
          new="const s=getComputedStyle(el);const margins=(parseFloat(s.marginTop)||0)+(parseFloat(s.marginBottom)||0);el.style.minHeight='0';el.style.height=Math.max(260,Math.min(840,(window.visualViewport?.height||innerHeight)-top-margins))+'px';"
          assert old in source or new in source
          router.write_text(source.replace(old,new))
          test=Path('scripts/test-chat.py');source=test.read_text()
          old="    assert page.locator('#home-question').bounding_box()['y']<560"
          new="    assert page.locator('#home-question').bounding_box()['y']<1000\n    expect(page.locator('[data-home-compose]')).to_be_visible()"
          assert old in source or new in source
          test.write_text(source.replace(old,new))
          font=Path('scripts/test-fonts.py');source=font.read_text()
          source=source.replace("fonts_for('.desktop-nav a', 'Geist Mono')","fonts_for('.desktop-nav a', 'Geist')").replace("fonts_for('.s-topic-rail button', 'Geist Mono')","fonts_for('.s-topic-rail button', 'Geist')")
          font.write_text(source)
          print('Applied original design source, kept actual content, imagery, licences and legal pages')
          PY
      - name: Validate JavaScript
        run: |
          for file in assets/*.js; do node --check "$file"; done
      - name: Install test browser
        run: |
          python3 -m pip install 'playwright==1.55.0' 'Pillow>=11,<13'
          python3 -m playwright install --with-deps chromium
      - name: Verify redesigned layout and real interactions
        env:
          LAYOUT_QA: internal-review
        run: python3 scripts/test-terms-layout.py
      - name: Verify all existing journeys and actual Vietnamese fonts
        run: |
          python3 scripts/test-chat.py
          python3 scripts/test-fonts.py
          python3 scripts/test-catalog.py
      - name: Commit reviewed design files only to the work branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/steel-ui.js assets/terms-alignment.css assets/chat-router.js scripts/test-chat.py scripts/test-fonts.py scripts/test-terms-layout.py
          if ! git diff --cached --quiet; then
            git commit -m 'feat: align website composition to inspected Terms reference (0.8.0)'
            git push origin HEAD:refs/heads/terms-layout-v080
          fi
      - name: Keep screenshots and report internal
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: terms-aligned-qa
          path: |
            internal-review/
            qa-chat/
            qa-fonts/
          if-no-files-found: ignore
          retention-days: 1
