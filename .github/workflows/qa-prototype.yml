name: UX prototype browser checks
on:
  push:
    branches: [main]
    paths: ['index.html','assets/**','scripts/**','.github/workflows/qa-prototype.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ux-prototype-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check JavaScript syntax
        run: |
          for script in assets/*.js; do node --check "$script"; done
      - name: Install test browser and image checks
        run: |
          python3 -m pip install 'playwright==1.55.0' 'Pillow>=11,<13'
          python3 -m playwright install --with-deps chromium
      - name: Check chat, contact and news journeys
        run: python3 scripts/test-chat.py
      - name: Verify Vietnamese glyphs and original-color photographs
        run: python3 scripts/test-fonts.py
      - name: Reconcile all 303 source titles and navigation
        run: python3 scripts/test-catalog.py
      - name: Check reference-aligned layout and icon separation
        run: python3 scripts/test-terms-layout.py
