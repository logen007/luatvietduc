name: UX prototype browser checks

on:
  push:
    branches: [main, ux-html-v0.3]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/qa-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check JavaScript syntax
        run: |
          node --check assets/content.js
          node --check assets/app.js
      - name: Install browser test dependencies
        run: |
          python3 -m pip install 'playwright==1.55.0'
          python3 -m playwright install --with-deps chromium
      - name: Test responsive layouts and prototype journeys
        run: python3 scripts/test-prototype.py
      - name: Export review artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: luatvietduc-html-review
          path: build/
          if-no-files-found: warn
          retention-days: 14
