name: UX prototype browser checks
on:
  push:
    branches: [main]
    paths: ['index.html','assets/**','scripts/**','.github/workflows/qa-prototype.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ux-prototype-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/chat-first.js
          node --check assets/newsroom.js
      - name: Install test browser
        run: |
          python3 -m pip install 'playwright==1.55.0'
          python3 -m playwright install --with-deps chromium
      - name: Check chat specialist knowledge and news interfaces
        run: python3 scripts/test-chat.py
