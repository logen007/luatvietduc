name: Verify restored website composition
on:
  push:
    branches: [restore-layout-081]
    paths: ['.github/workflows/review-layout-081.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate scripts and font stylesheet
        run: |
          node --check assets/steel-ui.js
          node --check assets/app.js
          node --check assets/catalog.js
          python3 - <<'PY'
          from pathlib import Path
          assert 'content="0.8.1"' in Path('index.html').read_text()
          assert "'LVD Geist'" in Path('assets/typography.css').read_text()
          assert 's-hero-grid' in Path('assets/steel-ui.js').read_text()
          assert 't-feature' not in Path('assets/steel-ui.js').read_text()
          assert '--max:960px' not in Path('assets/terms-alignment.css').read_text()
          PY
      - name: Install Chromium
        run: |
          python3 -m pip install 'playwright==1.55.0'
          python3 -m playwright install --with-deps chromium
      - name: Verify old composition and all routes
        run: |
          python3 - <<'PY'
          import http.server,threading
          from playwright.sync_api import sync_playwright
          class Quiet(http.server.SimpleHTTPRequestHandler):
            def log_message(self,*a):pass
          server=http.server.ThreadingHTTPServer(('127.0.0.1',0),Quiet)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          base=f'http://127.0.0.1:{server.server_port}/#'
          with sync_playwright() as p:
            browser=p.chromium.launch()
            for width in [390,768,1440]:
              page=browser.new_page(viewport={'width':width,'height':900},locale='vi-VN')
              errors=[]
              page.on('pageerror',lambda e:errors.append(str(e)))
              for route in ['/','/tra-cuu','/tin-tuc','/hoi-dap-ai','/lien-he','/chinh-sach-thong-tin','/dieu-khoan']:
                page.goto(base+route,wait_until='load')
                page.wait_for_timeout(150)
                assert page.evaluate('document.documentElement.scrollWidth')<=width+1,(route,width)
                assert page.locator('#main h1').count()==1,(route,width)
                if route=='/':
                  assert page.locator('.s-hero-grid .s-ask-panel').count()==1,(route,width)
                  assert page.locator('.s-news-grid').count()==1,(route,width)
                  assert page.locator('.s-library-links>a').count()==8,(route,width)
                  assert page.locator('.s-guides-grid .s-story').count()==4,(route,width)
                  if width==1440:
                    a=page.locator('.s-hero-copy').bounding_box()
                    b=page.locator('.s-ask-panel').bounding_box()
                    assert a['x']+a['width']<=b['x']+10,(a,b)
                print('PASS',width,route,flush=True)
              assert not errors,errors
              page.close()
            browser.close()
          server.shutdown()
          PY
