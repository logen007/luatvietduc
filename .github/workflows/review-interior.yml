name: Review editorial interior pages
on:
  push:
    branches: [interior-editorial-v073]
    paths:
      - '.github/workflows/review-interior.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Syntax and data integrity
        run: |
          node --check assets/newsroom.js
          node --check assets/catalog.js
          node --check assets/chat-first.js
          node --check assets/app.js
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          assert 'content="0.7.3"' in html
          assert 'assets/interior-design.css?v=0.7.3' in html
          assert 'assets/catalog-source.js?v=0.7.3' in html
          assert "expectedTotal:303" in Path('assets/catalog-source.js').read_text()
          assert "items.map((s,i)=>card(s,i===0?'lead':'standard',i===0))" in Path('assets/newsroom.js').read_text()
          assert Path('assets/photos/library-1200.webp').exists()
          assert Path('assets/photos/berlin-1200.webp').exists()
          print('Source and fixture checks passed')
          PY
      - name: Install browser
        run: |
          python3 -m pip install 'playwright==1.55.0'
          python3 -m playwright install --with-deps chromium
      - name: Review all primary interior paths at three sizes
        run: |
          mkdir -p internal-qa
          python3 - <<'PY'
          import functools,http.server,threading,json
          from playwright.sync_api import sync_playwright
          class Quiet(http.server.SimpleHTTPRequestHandler):
            def log_message(self,*args): pass
          server=http.server.ThreadingHTTPServer(('127.0.0.1',0),Quiet)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          base=f'http://127.0.0.1:{server.server_port}/'
          routes=[
            ('catalog','/tra-cuu'),
            ('category','/chu-de/hon-nhan-gia-dinh'),
            ('topics','/tra-cuu?xem=tat-ca'),
            ('news','/tin-tuc'),
            ('guides','/song-o-duc'),
            ('article','/tin/mindestlohn-2026'),
            ('chat','/hoi-dap-ai'),
            ('contact','/gui-cau-hoi'),
          ]
          report=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True)
            for width in [390,768,1440]:
              context=browser.new_context(viewport={'width':width,'height':900},locale='vi-VN',reduced_motion='reduce')
              page=context.new_page()
              errors=[]
              page.on('pageerror',lambda e:errors.append(str(e)))
              for label,route in routes:
                page.goto(base+'#'+route,wait_until='load')
                page.wait_for_timeout(350)
                page.evaluate('document.fonts.ready')
                info=page.evaluate("""() => ({
                  innerWidth:innerWidth,
                  scrollWidth:document.documentElement.scrollWidth,
                  h1:document.querySelector('#main h1')?.textContent,
                  stylesheet:[...document.styleSheets].some(s=>s.href?.includes('interior-design.css')),
                  images:[...document.querySelectorAll('#main img')].filter(i=>i.complete && i.naturalWidth===0).length,
                  cards:document.querySelectorAll('.listing-grid .press-card').length,
                  lead:document.querySelectorAll('.listing-grid .press-card.lead').length,
                  hero:document.querySelector('.catalog-page > .page-heading, .newsroom-list > .page-heading')?.getBoundingClientRect().height||0
                })""")
                assert info['scrollWidth'] <= width+2,(label,width,info)
                assert info['stylesheet'] and info['h1'],(label,width,info)
                assert info['images']==0,(label,width,info)
                if label=='catalog':
                  assert info['hero']>=130 and page.locator('.catalog-group').count()==16,(label,width,info)
                  if width==1440:
                    assert page.locator('.catalog-group').first.bounding_box()['height'] <= 165
                if label=='news':
                  assert info['cards']>0 and info['lead']==1,(label,width,info)
                  if width==1440 and info['cards']>1:
                    secondary=page.locator('.listing-grid > .press-card').nth(1)
                    photo_height=secondary.locator('.press-photo').bounding_box()['height']
                    card_height=secondary.bounding_box()['height']
                    assert photo_height/card_height > .55,(photo_height,card_height)
                if label=='article':
                  assert page.locator('.news-figure img').count()>=1 and page.locator('.news-summary').count()==1
                if label=='chat':
                  assert page.locator('.chat-compose textarea').count()==1
                if width in [390,1440]:
                  page.screenshot(path=f'internal-qa/{label}-{width}.png',full_page=(label!='chat'))
                report.append(dict(label=label,width=width,**info))
                print('PASS',width,label,flush=True)
              assert not errors,errors
              context.close()
            browser.close()
          server.shutdown()
          open('internal-qa/report.json','w').write(json.dumps(report,ensure_ascii=False,indent=2))
          print('All 24 interior views passed')
          PY
      - name: Keep screenshots internal
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: interior-editorial-review
          path: internal-qa/
          if-no-files-found: ignore
          retention-days: 1
