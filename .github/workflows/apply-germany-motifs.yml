name: Verify and import subtle Germany SVGs
on:
  push:
    branches: [subtle-germany-v071]
    paths: ['.github/workflows/apply-germany-motifs.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Download verified public-domain Wikimedia SVG assets
        run: |
          python3 - <<'PY'
          import hashlib, json, re, time, urllib.request, xml.etree.ElementTree as ET
          from pathlib import Path
          sources=json.loads(Path('assets/illustration-sources.json').read_text())
          for item in sources:
            if item['id'] not in ('berlin-tv-tower','germany-shape'): continue
            url=item['original']
            assert url.startswith('https://upload.wikimedia.org/wikipedia/commons/')
            error=None
            for retry in range(4):
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'LuatVietDuc/0.7.1 (public-domain asset with attribution)'})
                with urllib.request.urlopen(req,timeout=30) as r:
                  assert r.status==200
                  data=r.read(50000)
                assert 500<len(data)<30000,(item['id'],len(data))
                low=data.lower()
                assert b'<svg' in low and b'<script' not in low and b'javascript:' not in low
                assert b'<foreignobject' not in low and not re.search(rb'\son[a-z]+\s*=',low)
                tree=ET.fromstring(data)
                assert tree.tag.endswith('svg'),tree.tag
                path=Path('assets')/(item['id']+'.svg')
                path.write_bytes(data)
                print(item['id'],len(data),'bytes',hashlib.sha256(data).hexdigest(),flush=True)
                break
              except Exception as e:
                error=e
                print('Retry:',item['id'],retry,str(e),flush=True)
                time.sleep(3*(retry+1))
            else: raise RuntimeError(f'Cannot retrieve {item["id"]}: {error}')
          PY
      - name: Validate existing library, images, typography and website scripts
        run: |
          node --check assets/app.js
          node --check assets/steel-ui.js
          node --check assets/catalog.js
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          data=Path('assets/catalog-source.js').read_text(encoding='utf-8')
          assert 'expectedTotal:303' in data and data.count("group('")==16
          css=Path('assets/germany-details.css').read_text()
          assert "url('berlin-tv-tower.svg')" in css and "url('germany-shape.svg')" in css
          assert "opacity: .12" in css and "opacity: .07" in css
          assert Path('assets/brandenburg-gate.svg').is_file()
          for name in ('berlin-tv-tower.svg','germany-shape.svg'):
            assert Path('assets',name).is_file()
          assert 'content="0.7.1"' in Path('index.html').read_text()
          sources=json.loads(Path('assets/illustration-sources.json').read_text())
          assert {i['id'] for i in sources} >= {'berlin-tv-tower','germany-shape','brandenburg-gate'}
          print('SVG, catalogue and source data verified')
          PY
      - name: Install browser and inspect mobile and desktop
        run: |
          python3 -m pip install 'playwright==1.55.0'
          python3 -m playwright install --with-deps chromium
          python3 - <<'PY'
          import functools,threading,http.server
          from playwright.sync_api import sync_playwright
          class Quiet(http.server.SimpleHTTPRequestHandler):
            def log_message(self,*a): pass
          server=http.server.ThreadingHTTPServer(('127.0.0.1',0),Quiet)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          with sync_playwright() as p:
            b=p.chromium.launch()
            for width in (390,768,1440):
              page=b.new_page(viewport={'width':width,'height':900},device_scale_factor=1)
              errors=[]
              page.on('pageerror',lambda err:errors.append(str(err)))
              page.goto(f'http://127.0.0.1:{server.server_port}/#/ ',wait_until='load')
              page.goto(f'http://127.0.0.1:{server.server_port}/#/',wait_until='load')
              page.wait_for_selector('.s-hero.chat-hero')
              page.evaluate('document.fonts.ready')
              info=page.evaluate("""() => {
                let hero=document.querySelector('.s-hero.chat-hero');
                let library=document.querySelector('.s-library');
                let a=getComputedStyle(hero,'::before');
                let map=getComputedStyle(library,'::after');
                return {body:document.documentElement.scrollWidth,viewport:innerWidth,tower:a.maskImage||a.webkitMaskImage,map:map.maskImage||map.webkitMaskImage,heading:document.querySelector('.s-hero h1')?.textContent}
              }""")
              assert 'berlin-tv-tower.svg' in info['tower'],info
              assert 'germany-shape.svg' in info['map'],info
              assert info['body'] <= info['viewport']+1,info
              assert info['heading'] and not errors,(info,errors)
              print('PASS visual DOM',width)
              page.close()
            b.close()
          server.shutdown()
          PY
      - name: Commit only the sourced SVG bytes to the review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/berlin-tv-tower.svg assets/germany-shape.svg
          if ! git diff --cached --quiet; then
            git commit -m "assets: import two cited public-domain German SVG silhouettes"
            git pull --rebase origin subtle-germany-v071
            git push origin HEAD:refs/heads/subtle-germany-v071
          fi
